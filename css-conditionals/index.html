<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Animation on scroll</title>
	<link rel="stylesheet" href="normalization.css" />
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<header>
		<a href="#">Logo</a>
		<nav>
			<a href="#cards-section">Section 1</a>
			<a href="#footer">Footer</a>
		</nav>
	</header>

	<section id="cards-section" style="background-color: #202020">
		<h2>Meus cards</h2>

		<ul>
			<li class="card" data-status="success">
				<h3>Card 1</h3>
			</li>
			<li class="card" data-status="warning">
				<h3>Card 2</h3>
			</li>
			<li class="card" data-status="error">
				<h3>Card 3</h3>
			</li>
		</ul>
	</section>

	<footer id="footer">
		<span>Footer</span>
	</footer>
</body>
</html>
